name: refresh-dataset
on:
  schedule:
    - cron: "17 11 * * 1,4"   # Mon+Thu 11:17 UTC; TC edits the list irregularly
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - name: fetch + build
        id: refresh
        run: |
          set +e
          .venv/bin/evrebate refresh | tee refresh.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - run: .venv/bin/pytest -q
      - name: commit if changed
        run: |
          git config user.name "evrebate-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ site/dataset.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +%F)" -m "$(cat refresh.log)"
          git push
      - name: open issue on consistency drift
        if: steps.refresh.outputs.code == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `EVAP rules drift detected ${new Date().toISOString().slice(0,10)}`,
              body: "Published TC amounts no longer match rules/federal_evap.yaml. Review and bump rules_version.\n\n```\n" + fs.readFileSync('refresh.log','utf8') + "\n```",
              labels: ['rules-review'],
            });
      - name: fail if parser broke
        if: steps.refresh.outputs.code != '0' && steps.refresh.outputs.code != '3'
        run: exit 1
