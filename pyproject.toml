[project]
name = "evrebate"
version = "0.1.0"
description = "Data pipeline that maintains the dataset behind a Canadian federal EV rebate (EVAP) calculator"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evrebate = "evrebate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evrebate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
